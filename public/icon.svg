<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <!-- App icon (PWA "any"): the favicon tank on a rounded grass tile. -->
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5e08a"/>
      <stop offset="1" stop-color="#7fbf55"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grass)"/>
  <g transform="translate(256 256) scale(13) translate(-16 -14.5) rotate(-90 16 16)">
    <!-- tracks -->
    <rect x="6.88" y="4" width="18.24" height="5.28" fill="#0f1f3f"/>
    <rect x="6.88" y="22.72" width="18.24" height="5.28" fill="#0f1f3f"/>
    <g fill="#091226">
      <rect x="8.88" y="5" width="2" height="3.28"/><rect x="8.88" y="23.72" width="2" height="3.28"/>
      <rect x="12.44" y="5" width="2" height="3.28"/><rect x="12.44" y="23.72" width="2" height="3.28"/>
      <rect x="16" y="5" width="2" height="3.28"/><rect x="16" y="23.72" width="2" height="3.28"/>
      <rect x="19.56" y="5" width="2" height="3.28"/><rect x="19.56" y="23.72" width="2" height="3.28"/>
      <rect x="23.12" y="5" width="2" height="3.28"/><rect x="23.12" y="23.72" width="2" height="3.28"/>
    </g>
    <!-- hull -->
    <rect x="7.88" y="9.28" width="16.24" height="13.44" fill="#3d7dff"/>
    <rect x="7.88" y="9.28" width="16.24" height="4.7" fill="#4c9cff"/>
    <!-- muffler -->
    <rect x="4" y="13.12" width="4.88" height="5.76" fill="#22262b"/>
    <rect x="4" y="13.12" width="2" height="5.76" fill="#394049"/>
    <!-- barrel + turret -->
    <rect x="16" y="14.08" width="15" height="3.84" fill="#22262b"/>
    <circle cx="16" cy="16" r="7.2" fill="#336ad8" stroke="#1e3e7f" stroke-width="1"/>
  </g>
</svg>
